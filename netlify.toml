# Automotores 828 · publica SOLO la lista blanca de scripts/build-site.mjs
[build]
  command = "node scripts/build-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Segunda barrera: los archivos internos devuelven 404
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/plan.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_config.yml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché: los archivos no llevan hash, por eso solo las fuentes (casi nunca cambian) son immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
